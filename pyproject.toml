[build-system]
requires = ["uv_build >=0.12.5,<1.0.0"]
build-backend = "uv_build"

[project]
name = "zmq-anyio"
version = "0.4.0"
description = "Asynchronous API for ZMQ using AnyIO"
readme = "README.md"
authors = [
  {name = "David Brochart", email = "david.brochart@gmail.com"},
]
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Typing :: Typed",
  "Topic :: System :: Networking",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
requires-python = ">= 3.10"
dependencies = [
  "anyio >=4.15.0,<5.0.0",
  "pyzmq >=27.1.0,<28.0.0",
  "typing_extensions >=4.15.0,<5.0.0; python_version<'3.11'",
]

[dependency-groups]
test = [
  "pytest >=9,<10",
  "pytest-timeout",
  "trio",
  "mypy",
  "ruff",
  "coverage >=7,<8",
]

[project.urls]
Source = "https://github.com/QuantStack/zmq-anyio"
Issues = "https://github.com/QuantStack/zmq-anyio/issues"

[tool.coverage.run]
source = ["zmq_anyio", "tests"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
timeout = 10

[tool.uv.build-backend]
source-include = ["tests/**"]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]
